name: Test Run

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      scrapers:
        description: 'Scrapers to run (comma-separated list, e.g. "amazon,flipkart", or "all")'
        required: false
        default: 'all'
      once:
        description: 'Run once mode in loop for 3h55m'
        required: false
        type: boolean
        default: true
      no_sync:
        description: 'Disable active-standby runner coordination'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run test runner
        env:
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
        run: |
          ARGS=""
          IS_ONCE="true"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.scrapers }}" ] && [ "${{ inputs.scrapers }}" != "all" ]; then
              ARGS="$ARGS --run ${{ inputs.scrapers }}"
            fi
            
            # Parse no-sync flag
            if [ "${{ inputs.no_sync }}" = "true" ]; then
              ARGS="$ARGS --no-sync"
            fi
            
            # Check once input
            if [ "${{ inputs.once }}" = "false" ]; then
              IS_ONCE="false"
            fi
          else
            # Default scheduled trigger parameters (runs every 4 hours via cron)
            ARGS=""
            IS_ONCE="true"
          fi

          
          TOTAL_SECONDS=14100 # 3 hours 55 minutes
          
          if [ "$IS_ONCE" = "true" ]; then
            echo "Starting --once loop mode for 3 hours 55 minutes..."
            END_TIME=$(( $(date +%s) + TOTAL_SECONDS ))
            ITERATION=1
            while [ $(date +%s) -lt $END_TIME ]; do
              echo "=== Starting Iteration $ITERATION at $(date) ==="
              python runner.py $ARGS --once || true
              ITERATION=$((ITERATION + 1))
              REMAINING=$(( END_TIME - $(date +%s) ))
              if [ $REMAINING -le 30 ]; then
                echo "Time limit reached (remaining: ${REMAINING}s). Exiting loop cleanly."
                break
              fi
              echo "Iteration complete. Waiting 30s before next iteration (remaining: ${REMAINING}s)..."
              sleep 30
            done
          else
            echo "Executing with built-in scheduler: python runner.py $ARGS --runtime 3h55m"
            python runner.py $ARGS --runtime 3h55m
          fi



